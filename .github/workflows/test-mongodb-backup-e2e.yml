name: Test MongoDB Backup E2E

# Teste FUNCIONAL do backup/restore do Korrelo contra o cluster de Atlas de
# TESTE (com GridFS). Roda SOMENTE de forma manual: nao ha trigger de push,
# pull_request nem schedule - nada aqui pode disparar sozinho.
on:
  workflow_dispatch:
    inputs:
      gridfs_mb:
        description: "Volume total do GridFS sintetico, em MB"
        required: false
        default: "100"

permissions:
  contents: read

jobs:
  mongodb-backup-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checar o secret KORRELO_TEST_MONGO_URI
        env:
          KORRELO_TEST_MONGO_URI: ${{ secrets.KORRELO_TEST_MONGO_URI }}
        run: |
          set -euo pipefail
          if [ -z "${KORRELO_TEST_MONGO_URI:-}" ]; then
            echo "::error::Secret KORRELO_TEST_MONGO_URI ausente. O teste aborta ANTES de qualquer conexao."
            exit 1
          fi
          echo "Secret KORRELO_TEST_MONGO_URI presente (valor nunca e exibido)."

      - name: Instalar MongoDB Database Tools (mongodump/mongorestore)
        run: |
          set -euo pipefail
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-jammy}"
          INSTALADO=0
          for TRY in "$CODENAME" jammy focal; do
            curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc \
              | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
            echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${TRY}/mongodb-database-tools/7.0 multiverse" \
              | sudo tee /etc/apt/sources.list.d/mongodb-database-tools-7.0.list >/dev/null
            if sudo apt-get update -qq && sudo apt-get install -y -qq mongodb-database-tools; then
              INSTALADO=1
              break
            fi
            sudo rm -f /etc/apt/sources.list.d/mongodb-database-tools-7.0.list
          done
          if [ "$INSTALADO" -ne 1 ] || ! command -v mongodump >/dev/null; then
            echo "::error::MongoDB Database Tools nao instalados (mongodump ausente)."
            exit 1
          fi
          mongodump --version | head -n 1
          mongorestore --version | head -n 1

      - name: Instalar o driver mongodb (fora do repositorio)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mongo-driver"
          npm install --prefix "$RUNNER_TEMP/mongo-driver" --no-package-lock --no-save mongodb
          echo "KORRELO_MONGO_DRIVER_DIR=$RUNNER_TEMP/mongo-driver/node_modules" >> "$GITHUB_ENV"

      - name: Rodar o teste E2E de backup/restore
        env:
          KORRELO_TEST_MONGO_URI: ${{ secrets.KORRELO_TEST_MONGO_URI }}
          KORRELO_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          KORRELO_TEST_GRIDFS_MB: ${{ inputs.gridfs_mb }}
        run: node scripts/test/mongodb-backup-e2e.cjs

      - name: Publicar o relatorio sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-e2e-report
          path: ${{ runner.temp }}/korrelo-mongodb-e2e-report.json
          retention-days: 7
          if-no-files-found: ignore
