server {
  listen 80;
  server_name korrelo.test;
  return 301 https://$host:8443$request_uri;
}

server {
  listen 443 ssl;
  server_name korrelo.test;

  ssl_certificate     /etc/nginx/certs/korrelo.test.crt;
  ssl_certificate_key /etc/nginx/certs/korrelo.test.key;

  # API primeiro (mais específico), sem isso o location "/" pega tudo.
  location /api/ {
    proxy_pass http://host.docker.internal:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://host.docker.internal:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Necessário pro hot-reload do Next.js dev funcionar através do proxy.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
