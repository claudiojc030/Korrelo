services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: korrelo
      POSTGRES_PASSWORD: korrelo
      POSTGRES_DB: korrelo
    ports:
      - "5432:5432"
    volumes:
      - korrelo_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"

volumes:
  korrelo_pgdata:
